title: Recipes
description: Things I have actually cooked.
markdown: kramdown
# Recipe pages live in recipes/<slug>/index.md, with their photos beside them.
defaults:
  - scope:
      path: "recipes"
    values:
      layout: recipe
exclude:
  - README.md
  - CLAUDE.md
  - templates
  - Gemfile
  - Gemfile.lock
  - vendor

# Used for the "Add photos" button on each recipe page.
repository: jdankiewicz/recipes
branch: main
