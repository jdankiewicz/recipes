---
layout: default
---
<header class="band home">
  <div class="band-inner">
    <h1 class="display brand">{{ site.title }}</h1>
    <p class="tagline">{{ site.description }}</p>
    <input id="q" type="search" placeholder="What's cooking? Search dishes, ingredients, notes" autocomplete="off" aria-label="Search recipes">
  </div>
</header>
<div class="stripes" aria-hidden="true"></div>
<main class="page">
  <div class="filters">
    <label class="filter-select">
      <span class="sr-only">Filter by tag</span>
      <select id="tagpick" aria-label="Filter by tag"><option value="">Filter by tag</option></select>
    </label>
    <div id="active" class="active-tags" aria-live="polite"></div>
  </div>
  <p id="count" class="count"></p>
  <ul id="results" class="results"></ul>
  <noscript>
    <ul class="results">
    {% assign recipes = site.pages | where: "layout", "recipe" | sort: "title" %}
    {% for r in recipes %}<li><a class="card" href="{{ r.url | relative_url }}"><span class="t">{{ r.title }}</span></a></li>{% endfor %}
    </ul>
  </noscript>
</main>
<script>window.SEARCH_INDEX_URL = "{{ '/search.json' | relative_url }}";</script>
<script src="{{ '/assets/search.js' | relative_url }}"></script>
